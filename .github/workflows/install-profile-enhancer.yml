name: Finalize AnimeTracker cleanup

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate runtime files and remove legacy layers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]+profile-enhancer(?:-v2|-v3|-v4|-v5|-v6)?\.js[^>]*></script>\s*', '', s, flags=re.I)
          s = re.sub(r'<script[^>]+auth-flow(?:-v2)?\.js[^>]*></script>\s*', '', s, flags=re.I)
          s = re.sub(r'<script[^>]+password-recovery\.js[^>]*></script>\s*', '', s, flags=re.I)
          s = re.sub(r'<link[^>]+profile-enhancer\.css[^>]*>\s*', '', s, flags=re.I)
          s = s.replace('</head>', '<link rel="stylesheet" href="./profile-enhancer.css">\n</head>', 1)
          s = s.replace('</body>', '<script src="./profile-enhancer.js"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          test "$(grep -o 'profile-enhancer\.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'profile-enhancer-v[0-9]*\.js\|auth-flow-v[0-9]*\.js\|password-recovery\.js' index.html | wc -l)" -eq 0
          test -f profile-enhancer.js
          test -f profile-enhancer.css

          git rm -f profile-enhancer-v2.js profile-enhancer-v3.js profile-enhancer-v4.js profile-enhancer-v5.js profile-enhancer-v6.js auth-flow-v2.js auth-flow.js password-recovery.js
          git rm -f .github/workflows/install-profile-enhancer.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html build.mjs profile-enhancer.js
          git commit -m 'chore: consolidate runtime and remove legacy sync layers'
          git push
