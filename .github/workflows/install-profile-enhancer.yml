name: Install AnimeTracker profile enhancer

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject current profile enhancer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+profile-enhancer(?:-v2|-v3)?\.js[^>]*></script>\n?', '', s)
          s=re.sub(r'<link[^>]+profile-enhancer\.css[^>]*>\n?', '', s)
          s=re.sub(r'<script[^>]+password-recovery\.js[^>]*></script>\n?', '', s)
          s=s.replace('</head>', '<link rel="stylesheet" href="./profile-enhancer.css">\n</head>', 1)
          s=s.replace('</body>', '<script src="./profile-enhancer-v3.js"></script>\n<script src="./password-recovery.js"></script>\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected script
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'fix: working password recovery flow'
            git push
          fi
