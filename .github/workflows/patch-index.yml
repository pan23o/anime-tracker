name: Patch index assets

on:
  push:
    branches: [main]
    paths:
      - 'profile-enhancer.js'
      - 'profile-enhancer.css'
      - '.github/workflows/patch-index.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./profile-enhancer.css">'
          js = '<script src="./profile-enhancer.js"></script>'
          if css not in s:
              s = s.replace('</head>', f'{css}\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', f'{js}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load profile enhancer'
          git push